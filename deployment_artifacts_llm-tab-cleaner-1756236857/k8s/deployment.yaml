apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-tab-cleaner
  namespace: llm-tab-cleaner
  labels:
    app: llm-tab-cleaner
    version: v0.3.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llm-tab-cleaner
  template:
    metadata:
      labels:
        app: llm-tab-cleaner
        version: v0.3.0
    spec:
      containers:
      - name: llm-tab-cleaner
        image: llm-tab-cleaner:production
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      imagePullSecrets:
      - name: registry-secret
