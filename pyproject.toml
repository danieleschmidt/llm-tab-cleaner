[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tab-cleaner"
version = "1.0.0"
description = "LLM-ready tabular data cleaning pipeline with audit trails and confidence scoring"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Daniel Schmidt"}
]
keywords = ["data-cleaning", "etl", "llm", "pandas", "audit"]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.23.0",
]

[project.scripts]
tab-cleaner = "tab_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
