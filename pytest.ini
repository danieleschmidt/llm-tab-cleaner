[tool:pytest]
# Pytest configuration for LLM Tab Cleaner

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test component interactions
    e2e: End-to-end tests that test complete workflows
    slow: Tests that take longer than usual to run
    requires_llm: Tests that require LLM API access
    requires_spark: Tests that require Apache Spark
    requires_gpu: Tests that require GPU acceleration
    benchmark: Performance and benchmarking tests
    regression: Regression tests for known bugs
    security: Security-related tests
    compliance: Compliance and governance tests

# Output and reporting
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --maxfail=5
    --durations=10
    --cov=src/llm_tab_cleaner
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --junitxml=junit.xml
    --ignore=build
    --ignore=dist
    --ignore=.tox
    --ignore=venv
    --ignore=.venv

# Warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Ignore specific warnings from dependencies
    ignore:.*distutils.*:DeprecationWarning
    ignore:.*imp module.*:DeprecationWarning
    ignore:.*pkg_resources.*:DeprecationWarning

# Minimum version
minversion = 7.0

# Test timeout (10 minutes for slow tests)
timeout = 600

# Parallel execution
# Uncomment to enable parallel test execution:
# -n auto

# Logging
log_auto_indent = true
log_cli = false
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_level = INFO
log_date_format = %Y-%m-%d %H:%M:%S
log_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d: %(message)s
log_level = INFO

# Test collection
collect_ignore = [
    "setup.py",
    "build",
    "dist",
    ".tox",
    "venv",
    ".venv",
    "node_modules"
]

# PytestXDist options (for parallel execution)
# dist = loadscope
# tx = popen//python=python3.11

# Cache
cache_dir = .pytest_cache

# Custom test ordering
# Tests will run in this order: unit -> integration -> e2e -> slow
# This ensures fast feedback and logical test progression
