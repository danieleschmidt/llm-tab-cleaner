apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-tab-cleaner
  namespace: llm-tab-cleaner
  labels:
    app: llm-tab-cleaner
    version: v2.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llm-tab-cleaner
  template:
    metadata:
      labels:
        app: llm-tab-cleaner
        version: v2.0.0
    spec:
      containers:
      - name: llm-tab-cleaner
        image: llm-tab-cleaner:v2.0.0
        ports:
        - containerPort: 8000
        env:
        - name: ENV
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        envFrom:
        - secretRef:
            name: llm-tab-cleaner-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
