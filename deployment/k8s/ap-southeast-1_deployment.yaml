{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "llm-tab-cleaner",
    "namespace": "llm-tab-cleaner-ap-southeast-1",
    "labels": {
      "app": "llm-tab-cleaner",
      "region": "ap-southeast-1",
      "compliance": "pdpa"
    }
  },
  "spec": {
    "replicas": 3,
    "selector": {
      "matchLabels": {
        "app": "llm-tab-cleaner"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "llm-tab-cleaner",
          "region": "ap-southeast-1"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "llm-tab-cleaner",
            "image": "llm-tab-cleaner:4.0.0-autonomous",
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "env": [
              {
                "name": "REGION",
                "value": "ap-southeast-1"
              },
              {
                "name": "COMPLIANCE_MODE",
                "value": "pdpa"
              },
              {
                "name": "DATA_RESIDENCY",
                "value": "True"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "500m",
                "memory": "1Gi"
              },
              "limits": {
                "cpu": "2000m",
                "memory": "4Gi"
              }
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8080
              },
              "initialDelaySeconds": 30,
              "periodSeconds": 10
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/ready",
                "port": 8080
              },
              "initialDelaySeconds": 10,
              "periodSeconds": 5
            }
          }
        ]
      }
    }
  }
}