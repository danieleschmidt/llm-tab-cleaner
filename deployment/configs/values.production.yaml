# Production values for LLM Tab Cleaner
replicaCount: 5

image:
  repository: llm-tab-cleaner
  tag: "v2.0.0"
  pullPolicy: Always

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.llm-tab-cleaner.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: llm-tab-cleaner-tls
      hosts:
        - api.llm-tab-cleaner.com

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true

config:
  environment: production
  logLevel: WARNING
  maxWorkers: 20
  cacheEnabled: true
  cacheSize: 10000
